<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备信息管理系统 (精简稳定版)</title>
    <style>
        :root {
            --primary-blue: #1b3f89;
            --bg-gray: #f2f3f5;
            --text-dark: #333;
            --text-light: #666;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg-gray); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #app { display: flex; height: 100vh; width: 100%; }
        
        .sidebar { width: 280px; background: #fff; border-right: 1px solid #eaeaea; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; flex-shrink: 0; }
        .app-title { font-size: 20px; font-weight: bold; color: var(--primary-blue); margin-bottom: 20px; padding: 10px; border-radius: 4px; }
        .dashboard-stats { background: #eef3fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .dashboard-stats h3 { color: var(--text-light); font-size: 14px; margin-bottom: 5px; }
        .dashboard-stats span { font-size: 28px; font-weight: bold; color: var(--primary-blue); }
        
        .device-group-list { list-style: none; flex: 1; overflow-y: auto; }
        .group-item { padding: 12px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border-radius: 4px; }
        .group-item:hover { background: #f4f6f8; }
        .group-item.active { background: #e3eaf3; border-right: 3px solid var(--primary-blue); }
        .group-item .info { display: flex; flex-direction: column; flex:1; overflow: hidden; }
        .group-item .name { font-size: 16px; font-weight: 600; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .group-item .sub-count { font-size: 13px; color: var(--text-light); margin-top: 4px; }

        .main-content { flex: 1; background: var(--bg-gray); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .detail-container { width: 100%; max-width: 600px; background: #fff; border-radius: 12px; box-shadow: var(--card-shadow); overflow: hidden; height: fit-content; margin: 0 auto; }
        .detail-header { background: var(--primary-blue); color: #fff; padding: 40px 20px; text-align: center; position: relative; }
        .detail-header h2 { font-size: 22px; font-weight: 600; }
        .back-to-group-btn { position: absolute; top: 15px; left: 15px; color: #fff; background: rgba(255,255,255,0.2); border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .back-to-group-btn:hover { background: rgba(255,255,255,0.4); }
        
        .device-main-img { width: 100%; height: 200px; background: #d8d8d8; display: flex; align-items: center; justify-content: center; color: #666; overflow: hidden; position: relative; }
        .device-main-img img { width: 100%; height: 100%; object-fit: contain; }
        
        .section { padding: 20px; border-bottom: 8px solid var(--bg-gray); position: relative; }
        .section-title { font-size: 16px; font-weight: 600; color: var(--text-dark); margin-bottom: 15px; }

        .info-row { display: flex; padding: 16px 0; border-bottom: 1px solid #f5f5f5; align-items: center; }
        .info-row:last-child { border-bottom: none; }
        .info-label { width: 130px; flex-shrink: 0; color: var(--text-dark); font-size: 15px; font-weight: 500; margin-right: 12px; }
        .info-value { flex: 1; font-size: 15px; color: var(--text-dark); padding: 8px 12px; border-radius: 6px; min-height: 40px; }

        .file-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .file-icon { width: 40px; height: 40px; background: #ff4d4f; color: #fff; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: bold; font-size: 18px; }
        .file-info { flex: 1; display: flex; flex-direction: column; }
        .file-name { font-weight: 500; font-size: 14px; }
        .file-size { font-size: 12px; color: var(--text-light); }
        .file-actions { display: flex; gap: 10px; }
        .btn-file { background: none; border: none; color: var(--primary-blue); cursor: pointer; font-size: 13px; }
        .btn-file:hover { text-decoration: underline; }
        
        .hidden { display: none !important; }
        .text-center { text-align: center; }

        @media (max-width: 768px) {
            #app { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; max-height: 300px; border-right: none; border-bottom: 1px solid #eaeaea; }
            .main-content { padding: 10px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="sidebar" id="sidebar">
        <h1 class="app-title" id="appTitle">设备信息管理系统</h1>
        <div class="dashboard-stats">
            <h3>设备总览</h3>
            <span id="totalDevices">0</span> 台
        </div>
        <div class="nav-header">
            <h3>设备组</h3>
        </div>
        <ul class="device-group-list" id="groupList"></ul>
    </div>

    <div class="main-content">
        <div id="mainContainer" style="width:100%; display:flex; justify-content:center; align-items:flex-start; flex-direction: column;">
            <div id="emptyState" class="text-center" style="padding: 50px; color: #999; width:100%;">
                <p>正在加载数据...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. 数据与配置区 (修复：已精简数据格式)
    // ==========================================
    
    // 📌 图片地址映射表 (d1 到 d38)
    const imageMap = {
        "d1": "", "d2": "", "d3": "", "d4": "", "d5": "", "d6": "", "d7": "", "d8": "", "d9": "", "d10": "",
        "d11": "", "d12": "", "d13": "", "d14": "", "d15": "", "d16": "", "d17": "", "d18": "", "d19": "", "d20": "",
        "d21": "", "d22": "", "d23": "", "d24": "", "d25": "", "d26": "", "d27": "", "d28": "", "d29": "", "d30": "",
        "d31": "", "d32": "", "d33": "", "d34": "", "d35": "", "d36": "", "d37": "", "d38": ""
    };

    // 📌 PDF地址映射表 (键=纯文件名，值=GitHub直链)
    const pdfMap = {
        "WNII-NI-ZY-044-2025 电除尘操作作业指导书 PT WNII NI Prosedur Pengoperasian ESP.pdf": "",
        "WNII-NI-ZY-046-2025 布袋除尘操作作业指导书 PT WNII NI Prosedur Kerja Inspeksi Bag House ESP.pdf": "",
        "WNII-NI-ZY-049-2025 电除尘刮板机检修作业指导书 PT WNII NI Prosedur Perbaikan Mesin Scraper ESP.pdf": "",
        "WNII-NI-ZY-050-2025 印尼华新镍业有限公司镍铁厂电除尘加湿机检修作业指导书 PT WNII NI Prosedur Perbaikan Pugmil ESP.pdf": "",
        "WNII-NI-ZY-045-2025 除尘皮带操作作业指导书 PT WNII NI Prosedur Pengoperasian Conveyor Debu Kasar Divisi ESP.pdf": "",
        "WNII-NI-ZY-053-2025 电除尘尾排风机检修作业指导书 PT WNII NI Prosedur Pemeriksaan dan Perbaikan Tailing Fan Divisi ESP.pdf": ""
        "WNII-NI-ZY-047-2025 布袋除尘更换滤袋检修作业指导书 PT WNII NI Prosedur Kerja Pergantian Filter Bag HouseBudai ESP.pdf": ""
        "WNII-NI-ZY-101-2025 电除尘加湿机操作作业指导书 PT WNII NI Prosedur Perbaikan Pugmil ESP.pdf": ""
        "WNII-NI-ZY-051-2025 电除尘静电除尘器检修 PT WNII NI Prosedur Perbaikan Ruang Pengendapan Elektrostatis (Precipitator Chamber) ESP(2).pdf": ""
        "WNII-NI-ZY-055-2025 电除尘阴阳极振打检修作业指导书 PT WNII NI Prosedur Perbaikan Vibrator Anoda dan Katoda ESP.pdf": ""
    };

    // 定义基础元数据模板（通过扩展减少冗余代码）
    const getMeta = (type, idx) => {
        const shared = { "Spesifikasi 设备型号": "Q235", "Volume Pengiriman 处理风量": "700000m³/H", "Voltage Secondary 额定电压": "72KV" };
        if (type === 'esp') return [
            { label: "Spesifikasi 设备型号", value: shared["Spesifikasi 设备型号"] },
            { label: "Nomor Peralatan设备编号", value: `WNII-NI-SC-DCC-SCQ-${String(idx).padStart(3, '0')}` },
            { label: "Voltage Secondary 额定电压", value: shared["Voltage Secondary 额定电压"] },
            { label: "Volume Pengiriman 处理风量", value: shared["Volume Pengiriman 处理风量"] }
        ];
        if (type === 'budai') return [
            { label: "Spesifikasi 设备型号", value: "ZD-PPCSM128-2*18" },
            { label: "Nomor Peralatan设备编号", value: `WNII-NI-SC-DCC-BD-${String(idx).padStart(3, '0')}` },
            { label: "Tekanan Diferensial 负压阻力", value: idx === 3 ? "＜1200 PA" : "＜1700 PA" },
            { label: "Volume Pengiriman 处理风量", value: idx === 3 ? "400000m³/H" : "360000m³/H" }
        ];
        if (type === 'scraper') {
            const model = idx <= 7 ? "FU350" : (idx <= 11 ? "FU200" : (idx <= 13 ? "FU150" : "FU150"));
            const motor = idx <= 7 ? "15KW" : (idx <= 11 ? "11KW" : (idx <= 13 ? "4KW" : "4KW"));
            const volume = idx <= 7 ? "80m³/H" : (idx <= 11 ? "40m³/H" : (idx <= 13 ? "23m³/H" : "23m³/H"));
            return [
                { label: "Spesifikasi 设备型号", value: model },
                { label: "Nomor Peralatan设备编号", value: `WNII-NI-SC-DCC-GBJ-${String(idx).padStart(3, '0')}` },
                { label: "Daya Motor 电机功率", value: motor },
                { label: "Volume Pengiriman 输送量", value: volume }
            ];
        }
        if (type === 'pugmill') return [
            { label: "Spesifikasi 设备型号", value: "SJS80" },
            { label: "Nomor Peralatan设备编号", value: `WNII-NI-SC-DCC-JSG-${String(idx).padStart(3, '0')}` },
            { label: "Daya Motor 电机功率", value: "22KW" },
            { label: "Volume Pengiriman 输送量", value: "80m³/H" }
        ];
        if (type === 'conveyor') return [
            { label: "Spesifikasi 设备型号", value: "DTIIA-800mm*35m" },
            { label: "Nomor Peralatan设备编号", value: `WNII-NI-SC-DCC-PDG-${String(idx).padStart(3, '0')}` },
            { label: "Daya Motor 电机功率", value: "7.5KW" },
            { label: "Volume Pengiriman 输送量", value: "400T/H" }
        ];
        if (type === 'fan') {
            const direction = idx % 2 === 0 ? "旋向L" : "旋向R";
            const model = idx <= 7 ? "Y4-2X73-14" : (idx <= 9 ? "Y5-2X55 23.5F" : "VZ65III-2240 F/S3");
            const volume = idx <= 7 ? "720000m³/H" : (idx <= 9 ? "700000m³/H" : "500000m³/H");
            return [
                { label: "Spesifikasi 设备型号", value: `${model} ${direction}` },
                { label: "Nomor Peralatan设备编号", value: `WNII-NI-SC-DCC-WPFJ-${String(idx).padStart(3, '0')}` },
                { label: "Daya Motor 电机功率", value: idx === 11 ? "1000KW" : "1400KW" },
                { label: "Volume Pengiriman 流量容积", value: volume }
            ];
        }
        return [];
    };

    // 完整数据组
    const STATIC_GROUPS = [
        {
            id: "g1", name: "ESP 电除尘器",
            devices: [
                { id: "d1", title: "37#ESP 电除尘器", meta: getMeta('esp', 1), manualList: [{ name: "WNII-NI-ZY-044-2025 电除尘操作作业指导书 PT WNII NI Prosedur Pengoperasian ESP.pdf", size: "1831.20 KB" }{ name: "WNII-NI-ZY-051-2025 电除尘静电除尘器检修 PT WNII NI Prosedur Perbaikan Ruang Pengendapan Elektrostatis (Precipitator Chamber) ESP(2).pdf", size: "1635.69 KB" }{ name: "WNII-NI-ZY-055-2025 电除尘阴阳极振打检修作业指导书 PT WNII NI Prosedur Perbaikan Vibrator Anoda dan Katoda ESP.pdf", size: "1949.69 KB" }] },
                { id: "d2", title: "38#ESP 电除尘器", meta: getMeta('esp', 2), manualList: [{ name: "WNII-NI-ZY-044-2025 电除尘操作作业指导书 PT WNII NI Prosedur Pengoperasian ESP.pdf", size: "1831.20 KB" }{ name: "WNII-NI-ZY-051-2025 电除尘静电除尘器检修 PT WNII NI Prosedur Perbaikan Ruang Pengendapan Elektrostatis (Precipitator Chamber) ESP(2).pdf", size: "1635.69 KB" }{ name: "WNII-NI-ZY-055-2025 电除尘阴阳极振打检修作业指导书 PT WNII NI Prosedur Perbaikan Vibrator Anoda dan Katoda ESP.pdf", size: "1949.69 KB" }] },
                { id: "d3", title: "39#ESP 电除尘器", meta: getMeta('esp', 3), manualList: [{ name: "WNII-NI-ZY-044-2025 电除尘操作作业指导书 PT WNII NI Prosedur Pengoperasian ESP.pdf", size: "1831.20 KB" }{ name: "WNII-NI-ZY-051-2025 电除尘静电除尘器检修 PT WNII NI Prosedur Perbaikan Ruang Pengendapan Elektrostatis (Precipitator Chamber) ESP(2).pdf", size: "1635.69 KB" }{ name: "WNII-NI-ZY-055-2025 电除尘阴阳极振打检修作业指导书 PT WNII NI Prosedur Perbaikan Vibrator Anoda dan Katoda ESP.pdf", size: "1949.69 KB" }] },
                { id: "d4", title: "40#ESP 电除尘器", meta: getMeta('esp', 4), manualList: [{ name: "WNII-NI-ZY-044-2025 电除尘操作作业指导书 PT WNII NI Prosedur Pengoperasian ESP.pdf", size: "1831.20 KB" }{ name: "WNII-NI-ZY-051-2025 电除尘静电除尘器检修 PT WNII NI Prosedur Perbaikan Ruang Pengendapan Elektrostatis (Precipitator Chamber) ESP(2).pdf", size: "1635.69 KB" }{ name: "WNII-NI-ZY-055-2025 电除尘阴阳极振打检修作业指导书 PT WNII NI Prosedur Perbaikan Vibrator Anoda dan Katoda ESP.pdf", size: "1949.69 KB" }] },
            ]
        },
        {
            id: "g2", name: "BUDAI 布袋除尘器",
            devices: [
                { id: "d5", title: "1#BUDAI 布袋除尘器", meta: getMeta('budai', 1), manualList: [{ name: "WNII-NI-ZY-046-2025 布袋除尘操作作业指导书 PT WNII NI Prosedur Kerja Inspeksi Bag House ESP.pdf", size: "1882.54 KB" }] },
                { id: "d6", title: "2#BUDAI 布袋除尘器", meta: getMeta('budai', 2), manualList: [{ name: "WNII-NI-ZY-046-2025 布袋除尘操作作业指导书 PT WNII NI Prosedur Kerja Inspeksi Bag House ESP.pdf", size: "1882.54 KB" }] },
                { id: "d7", title: "3#BUDAI 布袋除尘器", meta: getMeta('budai', 3), manualList: [{ name: "WNII-NI-ZY-046-2025 布袋除尘操作作业指导书 PT WNII NI Prosedur Kerja Inspeksi Bag House ESP.pdf", size: "1882.54 KB" }] }
            ]
        },
        {
            id: "g3", name: "SCRAPER 刮板机",
            devices: Array.from({ length: 14 }, (_, i) => {
                const idx = i + 8; // d8 to d21
                const suffix = i % 2 === 0 ? 'A' : 'B';
                const groupId = Math.floor((i / 2) + 37);
                const title = groupId > 40 ? `${Math.floor((i - 10) / 2) + 1}#${suffix} SCRAPER 刮板机` : `${groupId}#${suffix} SCRAPER 刮板机`;
                return {
                    id: `d${idx}`,
                    title: title,
                    meta: getMeta('scraper', idx),
                    manualList: [{ name: "WNII-NI-ZY-049-2025 电除尘刮板机检修作业指导书 PT WNII NI Prosedur Perbaikan Mesin Scraper ESP.pdf", size: "3674.17 KB" }]
                };
            })
        },
        {
            id: "g4", name: "Pugmill 加湿机",
            devices: Array.from({ length: 6 }, (_, i) => {
                const idx = i + 22; // d22 to d27
                const prefix = Math.floor(i / 3) + 1;
                const sub = (i % 3) + 1;
                return {
                    id: `d${idx}`,
                    title: `${prefix}#-${sub}Pugmill 加湿机`,
                    meta: getMeta('pugmill', i + 1),
                    manualList: [{ name: "WNII-NI-ZY-050-2025 印尼华新镍业有限公司镍铁厂电除尘加湿机检修作业指导书 PT WNII NI Prosedur Perbaikan Pugmil ESP.pdf", size: "4205.61 KB" }]
                };
            })
        },
        {
            id: "g5", name: "Conveyor 皮带机",
            devices: Array.from({ length: 4 }, (_, i) => {
                const idx = i + 28; // d28 to d31
                const num = i + 37;
                return {
                    id: `d${idx}`,
                    title: `${num}#Conveyor 皮带机`,
                    meta: getMeta('conveyor', i + 1),
                    manualList: [{ name: "WNII-NI-ZY-045-2025 除尘皮带操作作业指导书 PT WNII NI Prosedur Pengoperasian Conveyor Debu Kasar Divisi ESP.pdf", size: "3424.62 KB" }]
                };
            })
        },
        {
            id: "g6", name: "Ceiling Fan 尾排风机",
            devices: Array.from({ length: 7 }, (_, i) => {
                const idx = i + 32; // d32 to d38
                let title = "";
                if (i < 4) title = `${i + 37}#Ceiling Fan 尾排风机`;
                else if (i < 6) title = `${i - 3}#BUDAI Ceiling Fan 布袋尾排风机`;
                else title = `3#BUDAI Ceiling Fan 布袋尾排风机`;
                return {
                    id: `d${idx}`,
                    title: title,
                    meta: getMeta('fan', i + 1),
                    manualList: [{ name: "WNII-NI-ZY-053-2025 电除尘尾排风机检修作业指导书 PT WNII NI Prosedur Pemeriksaan dan Perbaikan Tailing Fan Divisi ESP.pdf", size: "4472.70 KB" }]
                };
            })
        }
    ];

    // ==========================================
    // 2. 纯渲染逻辑 (完全静态)
    // ==========================================
    let groups = STATIC_GROUPS;
    let currentGroupId = null;
    let currentDeviceId = null;

    function getGroup(id) { return groups.find(g => g.id === id); }
    function getDevice(groupId, deviceId) {
        const group = getGroup(groupId);
        if (!group) return null;
        return group.devices.find(d => d.id === deviceId);
    }
    function getCurrentDevice() {
        if (!currentGroupId || !currentDeviceId) return null;
        return getDevice(currentGroupId, currentDeviceId);
    }

    function renderAll() {
        renderSidebar();
        renderDashboard();
        renderMainContent();
    }

    function renderDashboard() {
        let totalDevices = 0;
        groups.forEach(g => totalDevices += (g.devices ? g.devices.length : 0));
        document.getElementById('totalDevices').innerText = totalDevices;
    }

    function renderSidebar() {
        const list = document.getElementById('groupList');
        list.innerHTML = '';
        groups.forEach(group => {
            const li = document.createElement('li');
            li.className = `group-item ${group.id === currentGroupId ? 'active' : ''}`;
            const subCount = group.devices ? group.devices.length : 0;
            li.innerHTML = `
                <div onclick="selectGroup('${group.id}')" class="info">
                    <div class="name">${group.name || '未命名组'}</div>
                    <div class="sub-count">${subCount} 台设备</div>
                </div>
            `;
            list.appendChild(li);
        });
    }

    function renderMainContent() {
        const container = document.getElementById('mainContainer');
        if (currentGroupId && currentDeviceId) {
            renderDeviceDetail(container);
            return;
        }
        if (currentGroupId) {
            renderGroupDetail(container);
            return;
        }
        container.innerHTML = `<div class="text-center" style="padding: 50px; color: #999; width:100%;"><p>请从左侧选择一个设备组查看详情。</p></div>`;
    }

    function renderGroupDetail(container) {
        const group = getGroup(currentGroupId);
        if (!group) { currentGroupId = null; renderAll(); return; }
        const devices = group.devices || [];

        container.innerHTML = `
            <div class="group-detail-container">
                <div class="group-detail-header">
                    <h2>${group.name}</h2>
                </div>
                <div class="sub-device-section">
                    <div class="section-title">
                        <span>下属设备 (${devices.length})</span>
                    </div>
                    <ul class="sub-device-list">
                        ${devices.length === 0 ? '<div class="text-center" style="padding: 20px; color: #999;">该组暂无设备</div>' : ''}
                        ${devices.map(device => `
                            <li class="sub-device-item">
                                <div onclick="selectDevice('${group.id}', '${device.id}')" class="info">
                                    <div class="name">${device.title || '未命名'}</div>
                                    <div class="code">${device.meta.find(m => m.label === 'Nomor Peralatan设备编号')?.value || '无编号'}</div>
                                </div>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            </div>
        `;
    }

    function renderDeviceDetail(container) {
        const device = getCurrentDevice();
        if (!device) { currentDeviceId = null; renderAll(); return; }

        const sectionsHtml = [];
        sectionsHtml.push(`
            <div class="section">
                <div class="section-title">设备信息</div>
                ${device.meta.map((field) => `
                    <div class="info-row">
                        <div class="info-label">${field.label}</div>
                        <div class="info-value">${field.value}</div>
                    </div>
                `).join('')}
            </div>
        `);

        // 处理多个 PDF 文件
        const hasManual = device.manualList && device.manualList.length > 0;
        
        let fileHtml = '';
        if (hasManual) {
            device.manualList.forEach(manual => {
                const pdfUrl = pdfMap[manual.name] || '';
                fileHtml += `
                    <div class="file-card">
                        <div class="file-icon">PDF</div>
                        <div class="file-info">
                            <div class="file-name">${manual.name}</div>
                            <div class="file-size">${manual.size}</div>
                        </div>
                        <div class="file-actions">
                            ${pdfUrl ? `
                                <button class="btn-file" onclick="previewFile('${pdfUrl}')">预览</button>
                                <button class="btn-file" onclick="downloadFile('${pdfUrl}', '${manual.name}')">下载</button>
                            ` : `
                                <span style="color:#999; font-size:12px;">请配置 pdfMap 中的 URL</span>
                            `}
                        </div>
                    </div>
                `;
            });
        } else {
            fileHtml = `<div style="border:dashed 2px #ddd; padding:20px; text-align:center; color:#999; border-radius:8px;">暂无操作说明书</div>`;
        }

        sectionsHtml.push(`
            <div class="section">
                <div class="section-title">操作说明书</div>
                <div id="fileSection">
                    ${fileHtml}
                </div>
            </div>
        `);

        const imgUrl = imageMap[device.id] || '';

        container.innerHTML = `
            <div class="detail-container">
                <div class="detail-header">
                    <button class="back-to-group-btn" onclick="goBackToGroup()">← 返回设备组</button>
                    <h2>${device.title}</h2>
                </div>
                <div class="device-main-img">
                    ${imgUrl ? `<img src="${imgUrl}" alt="${device.title}">` : `<span>暂无图片</span>`}
                </div>
                ${sectionsHtml.join('')}
            </div>
        `;
    }

    // ==========================================
    // 3. 交互与文件预览/下载
    // ==========================================
    function selectGroup(id) { currentGroupId = id; currentDeviceId = null; renderAll(); }
    function selectDevice(groupId, deviceId) { currentGroupId = groupId; currentDeviceId = deviceId; renderAll(); }
    function goBackToGroup() { currentDeviceId = null; renderAll(); }

    function previewFile(url) {
        if (!url) return alert("请先在代码顶部的 pdfMap 中填入正确的 PDF 网络地址！");
        const win = window.open();
        win.document.write(`<iframe src="${url}" width="100%" height="100%" style="border:none;"></iframe>`);
    }

    function downloadFile(url, fileName) {
        if (!url) return alert("请先在代码顶部的 pdfMap 中填入正确的 PDF 网络地址！");
        const a = document.createElement('a');
        a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    // ==========================================
    // 4. 启动应用
    // ==========================================
    renderAll();
</script>
</body>
</html>
